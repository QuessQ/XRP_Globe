name: Deploy to GitHub Pages

# Publishes the site by force-updating the gh-pages branch (the repo's Pages
# source). The site is fully static at the repo root, so the branch content
# is just a copy of the source branch.

on:
  push:
    branches: [claude/xrp-movement-globe-a1p5mz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push current commit to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
